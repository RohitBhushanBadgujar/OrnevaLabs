<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Orneva Labs</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- Ambient Backdrop -->
  <div class="ambient-glow-wrapper" aria-hidden="true">
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>
    <div class="bg-grid-pattern"></div>
  </div>

  <main style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="glass-card" style="padding: 3.5rem 2.5rem; border-radius: 24px; text-align: center; max-width: 540px; box-shadow: var(--card-shadow-hover);">
      
      <div style="font-size: 5rem; font-weight: 900; line-height: 1; margin-bottom: 1rem; color: #ff8a65; letter-spacing: -0.05em;">
        404
      </div>

      <h1 class="heading-md" style="margin-bottom: 0.85rem;">Page Not Found</h1>
      <p style="color: var(--text-secondary); font-size: 1rem; line-height: 1.6; margin-bottom: 2rem;">
        The resource you requested cannot be located. It may have been moved, renamed, or does not exist.
      </p>

      <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="index.html" class="btn btn-primary">
          Return to Homepage
        </a>
        <a href="courses.html" class="btn btn-secondary">
          Explore Courses
        </a>
      </div>

    </div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
