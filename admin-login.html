<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal Login | Orneva Labs</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body style="background: #060709;">

  <!-- Ambient Backdrop -->
  <div class="ambient-glow-wrapper" aria-hidden="true">
    <div class="ambient-glow-1" style="background: radial-gradient(circle, rgba(255, 87, 34, 0.12) 0%, transparent 70%);"></div>
    <div class="bg-grid-pattern"></div>
  </div>

  <main style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="glass-card" style="padding: 3rem 2.5rem; border-radius: 24px; width: 100%; max-width: 440px; border-color: rgba(255, 87, 34, 0.35); box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 40px rgba(255, 87, 34, 0.08);">
      
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="display: inline-flex; align-items: center; justify-content: center; width: 68px; height: 68px; border-radius: 18px; background: rgba(255, 87, 34, 0.08); border: 1px solid var(--primary-border); margin-bottom: 1.25rem;">
          <img src="assets/logo.png" alt="Orneva Labs" style="width: 40px; height: 40px; object-fit: contain;" />
        </div>
        <h1 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 0.25rem; letter-spacing: -0.02em;">Admin Console</h1>
        <p style="font-size: 0.82rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;">Authorized Back-Office Access</p>
      </div>

      <form id="admin-login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="admin-email">Admin Email</label>
          <input type="email" id="admin-email" class="form-control" placeholder="admin@ornevalabs.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="admin-password">Secure Password</label>
          <div class="password-input-group">
            <input type="password" id="admin-password" class="form-control" placeholder="••••••••••••" required autocomplete="current-password" />
            <button type="button" class="btn-toggle-password" data-target="admin-password" aria-label="Toggle password visibility">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <div style="margin-top: 2rem;">
          <button type="submit" id="admin-login-submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 0.95rem; font-weight: 700;">
            Authenticate & Access Portal
          </button>
        </div>

        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 0.5rem;">
          <small style="color: var(--text-muted); font-size: 0.78rem;">
            Secured Management Console &bull; Role-Enforced Server-Side
          </small>
          <a href="index.html" style="font-size: 0.8rem; color: #ff8a65; text-decoration: none;">&larr; Return to Orneva Labs</a>
        </div>
      </form>

    </div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const { $, showToast } = window.OrnevaUtils;

      // If already logged in as admin, verify session and redirect to admin.html
      if (window.OrnevaAuth && window.OrnevaAuth.isAdminLoggedIn()) {
        window.location.href = "admin.html";
        return;
      }

      // Password toggle
      document.querySelectorAll('.btn-toggle-password').forEach(btn => {
        btn.addEventListener('click', () => {
          const targetId = btn.getAttribute('data-target');
          const input = document.getElementById(targetId);
          if (!input) return;
          const isPassword = input.type === 'password';
          input.type = isPassword ? 'text' : 'password';
          const openIcon = btn.querySelector('.eye-open');
          const closedIcon = btn.querySelector('.eye-closed');
          if (openIcon && closedIcon) {
            openIcon.style.display = isPassword ? 'none' : 'block';
            closedIcon.style.display = isPassword ? 'block' : 'none';
          }
        });
      });

      const form = $('#admin-login-form');
      const btn = $('#admin-login-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = $('#admin-email').value.trim();
        const password = $('#admin-password').value;

        if (!email || !password) {
          showToast("Admin credentials required.", "warning");
          return;
        }

        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-inline" style="width: 16px; height: 16px;"></span> Verifying Credentials...`;

        try {
          const res = await window.OrnevaAPI.adminLogin(email, password);
          if (!res || !res.success) {
            showToast(res ? res.error : "Admin authorization rejected.", "error");
            btn.disabled = false;
            btn.innerHTML = `Authenticate & Access Portal`;
            return;
          }

          window.OrnevaAuth.setAdmin(res.data);
          showToast("Admin session authenticated. Launching dashboard...", "success");
          setTimeout(() => {
            window.location.href = "admin.html";
          }, 600);

        } catch (err) {
          console.error("Admin login error:", err);
          showToast("Network error during admin authentication.", "error");
          btn.disabled = false;
          btn.innerHTML = `Authenticate & Access Portal`;
        }
      });
    });
  </script>
</body>
</html>
