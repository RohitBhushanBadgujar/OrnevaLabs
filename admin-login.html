<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal Login | Orneva Labs</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body style="background: #060709;">

  <!-- Ambient Backdrop -->
  <div class="ambient-glow-wrapper" aria-hidden="true">
    <div class="ambient-glow-1" style="background: radial-gradient(circle, rgba(255, 87, 34, 0.12) 0%, transparent 70%);"></div>
    <div class="bg-grid-pattern"></div>
  </div>

  <main style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="glass-card" style="padding: 3rem 2.5rem; border-radius: 24px; width: 100%; max-width: 440px; border-color: rgba(255, 87, 34, 0.3); box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);">
      
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 16px; background: rgba(255, 87, 34, 0.08); border: 1px solid var(--primary-border); margin-bottom: 1rem;">
          <img src="assets/logo.png" alt="Orneva Labs" style="width: 38px; height: 38px; object-fit: contain;" />
        </div>
        <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.25rem;">Admin Console</h1>
        <p style="font-size: 0.82rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Orneva Labs Back-Office</p>
      </div>

      <form id="admin-login-form">
        <div class="form-group">
          <label class="form-label" for="admin-email">Admin Email</label>
          <input type="email" id="admin-email" class="form-control" placeholder="admin@ornevalabs.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="admin-password">Secure Password</label>
          <input type="password" id="admin-password" class="form-control" placeholder="••••••••••••" required autocomplete="current-password" />
        </div>

        <div style="margin-top: 2rem;">
          <button type="submit" id="admin-login-submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1rem;">
            Authenticate & Access Portal
          </button>
        </div>

        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color);">
          <small style="color: var(--text-muted); font-size: 0.78rem;">
            Authorized Personnel Only &bull; Secured Management Console
          </small>
        </div>
      </form>

    </div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const { $, showToast } = window.OrnevaUtils;

      // If already logged in as admin, go straight to admin.html
      if (window.OrnevaAuth && window.OrnevaAuth.isAdminLoggedIn()) {
        window.location.href = "admin.html";
        return;
      }

      const form = $('#admin-login-form');
      const btn = $('#admin-login-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = $('#admin-email').value.trim();
        const password = $('#admin-password').value;

        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-inline" style="width: 16px; height: 16px;"></span> Verifying Credentials...`;

        try {
          const res = await window.OrnevaAPI.adminLogin(email, password);
          if (!res || !res.success) {
            showToast(res ? res.error : "Admin authorization rejected.", "error");
            btn.disabled = false;
            btn.innerHTML = `Authenticate & Access Portal`;
            return;
          }

          window.OrnevaAuth.setAdmin(res.data);
          showToast("Admin session authenticated. Launching dashboard...", "success");
          setTimeout(() => {
            window.location.href = "admin.html";
          }, 600);

        } catch (err) {
          console.error("Admin login error:", err);
          showToast("Network error during admin authentication.", "error");
          btn.disabled = false;
          btn.innerHTML = `Authenticate & Access Portal`;
        }
      });
    });
  </script>
</body>
</html>
