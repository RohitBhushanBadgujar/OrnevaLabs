        <div class="nav-auth-slot">
          <a href="login.html" class="btn-nav-login">Sign In</a>

    </div>

    <div class="container">
      <!-- Checkout Layout Hook (Hydrated by js/payment.js) -->
      <div id="checkout-container">

      </div>
    </div>

  <!-- Site Footer -->

    <div class="container">
      <div class="footer-bottom" style="border: none; padding-top: 0;">
        <div>&copy; 2026 Orneva Labs. Official UPI ID: <code>9172750062@fam</code></div>

  <script src="js/utils.js"></script>
